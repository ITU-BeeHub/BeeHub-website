basePath: /api
definitions:
  admin.DownloadPage:
    properties:
      items:
        items:
          $ref: '#/definitions/download.Download'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  admin.PlatformCount:
    properties:
      count:
        type: integer
      os:
        type: string
    type: object
  admin.SeriesPoint:
    properties:
      byPlatform:
        additionalProperties:
          type: integer
        type: object
      period:
        type: string
      total:
        type: integer
    type: object
  admin.Summary:
    properties:
      byPlatform:
        items:
          $ref: '#/definitions/admin.PlatformCount'
        type: array
      last7Days:
        type: integer
      last30Days:
        type: integer
      today:
        type: integer
      total:
        type: integer
      uniqueIps:
        type: integer
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      expiresAt:
        type: string
      token:
        type: string
    type: object
  download.Download:
    properties:
      country:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      ipAddress:
        type: string
      os:
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  version.Info:
    properties:
      download_url:
        type: string
      version:
        type: string
    type: object
info:
  contact: {}
  description: Installer downloads, release information and the admin reporting API.
  title: BeeHub Website API
  version: "2.0"
paths:
  /admin/downloads:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 25
        description: Page size
        in: query
        maximum: 100
        name: pageSize
        type: integer
      - description: Search in IP address and country
        in: query
        name: q
        type: string
      - description: Platform filter
        enum:
        - windows
        - mac
        in: query
        name: os
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.DownloadPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download log
      tags:
      - Admin
  /admin/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Admin login
      tags:
      - Auth
  /admin/stats/daily:
    get:
      parameters:
      - default: 30
        description: Number of days, today included
        in: query
        maximum: 366
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.SeriesPoint'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daily downloads
      tags:
      - Admin
  /admin/stats/monthly:
    get:
      parameters:
      - default: 12
        description: Number of months, the current one included
        in: query
        maximum: 60
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.SeriesPoint'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Monthly downloads
      tags:
      - Admin
  /admin/stats/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.Summary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download summary
      tags:
      - Admin
  /download:
    get:
      description: Serves the installer of the current release. Only the request that
        starts a download is counted; HEAD requests, ranged requests that resume or
        split a transfer, and repeats within the dedup window are not.
      parameters:
      - description: Target platform
        enum:
        - windows
        - mac
        in: query
        name: os
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Download the installer
      tags:
      - Download
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Health check
      tags:
      - Health
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/version.Info'
      summary: Current release
      tags:
      - Version
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
