services:
  beehub-db:
    image: postgres:17
    container_name: beehub-db
    restart: always               # Sunucu açıldığında otomatik başlat
    ports:
      - "5429:5432"
    env_file:
      - /etc/beehub/env
    volumes:
      - beehub_pgdata:/var/lib/postgresql/data

volumes:
  beehub_pgdata:
    external: true 

