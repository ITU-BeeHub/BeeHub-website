# beehubapp.com — static frontend and the API on 127.0.0.1:9000.
# Traffic arrives over HTTPS at Cloudflare and reaches this server through
# the local cloudflared tunnel as plain HTTP on port 80.

upstream beehub_api {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name beehubapp.com www.beehubapp.com;

    root /var/www/beehubapp.com;
    index index.html;

    # Every request comes from cloudflared on loopback; use the visitor's
    # address from Cloudflare for logs and X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/beehubapp.com.access.log;
    error_log  /var/log/nginx/beehubapp.com.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://beehub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/download {
        proxy_pass http://beehub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream installers to the client instead of spooling them to disk.
        proxy_buffering off;
    }

    # Vite emits content-hashed file names under /assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
